{% extends "base.html" %}
{% block title %}Predict | Smart Health Assistant{% endblock %}
{% block content %}
<div class="card shadow-sm p-4">
  <h4>Select your symptoms</h4>
  <p class="text-muted">Choose at least <strong>3 symptoms</strong> you are currently experiencing.</p>

  <input type="text" id="symptomSearch" class="form-control mb-2"
         placeholder="🔍 Search symptom (e.g. fever, headache...)">
  <span id="counter" class="badge bg-primary mb-3">0 selected</span>

  <form method="POST" id="predictForm">
    <div class="row" id="symptomList">
      {% for s in symptoms %}
      <div class="col-lg-3 col-md-4 col-6 symptom-item" data-symptom="{{ s }}">
        <input type="checkbox" class="btn-check" id="s{{ loop.index }}"
               name="symptoms" value="{{ s }}" autocomplete="off">
        <label class="btn btn-outline-primary w-100 mb-2 text-truncate"
               for="s{{ loop.index }}">{{ s|title }}</label>
      </div>
      {% endfor %}
    </div>
    <div class="d-grid gap-2 col-md-4 mx-auto mt-3">
      <button class="btn btn-primary btn-lg fw-bold">Predict Disease 🔍</button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Live search filter for the symptom list
  document.getElementById('symptomSearch').addEventListener('input', function () {
    const q = this.value.toLowerCase();
    document.querySelectorAll('.symptom-item').forEach(function (item) {
      item.style.display = item.dataset.symptom.includes(q) ? '' : 'none';
    });
  });

  // Selected-symptom counter
  const boxes = document.querySelectorAll('input[name="symptoms"]');
  function updateCount() {
    const n = document.querySelectorAll('input[name="symptoms"]:checked').length;
    document.getElementById('counter').textContent = n + ' selected';
  }
  boxes.forEach(cb => cb.addEventListener('change', updateCount));

  // Minimum 3 symptoms validation
  document.getElementById('predictForm').addEventListener('submit', function (e) {
    const n = document.querySelectorAll('input[name="symptoms"]:checked').length;
    if (n < 3) {
      e.preventDefault();
      alert('Please select at least 3 symptoms.');
    }
  });
</script>
{% endblock %}
