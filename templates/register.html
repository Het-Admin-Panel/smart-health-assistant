{% extends "base.html" %}
{% block title %}Register | Smart Health Assistant{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm p-4">
      <h4 class="text-center mb-3">Create Account</h4>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Full Name *</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email *</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Age</label>
            <input type="number" name="age" min="1" max="120" class="form-control">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-select">
              <option value="">--</option>
              <option>Male</option><option>Female</option><option>Other</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password * <small class="text-muted">(min 6 characters)</small></label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm Password *</label>
          <input type="password" name="confirm" class="form-control" required>
        </div>
        <div class="d-grid">
          <button class="btn btn-primary fw-bold">Register</button>
        </div>
      </form>
      <p class="text-center mt-3 mb-0 small">
        Already registered? <a href="{{ url_for('login') }}">Login here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
