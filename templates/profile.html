{% extends "base.html" %}
{% block title %}My Health Profile{% endblock %}
{% block content %}
<div class="card-soft p-4 p-md-5 mx-auto" style="max-width:900px">

  <div class="d-flex align-items-center gap-3 mb-4 flex-wrap">
    <div style="width:60px;height:60px;border-radius:16px;display:grid;place-items:center;
      font-size:1.7rem;color:#fff;background:linear-gradient(135deg,#0d9488,#6366f1)">
      <i class="bi bi-person-heart"></i></div>
    <div class="flex-grow-1">
      <h4 class="fw-bold mb-0">{{ user.name }}</h4>
      <small class="text-muted">{{ user.email }} • {{ count }} consultation{{ '' if count == 1 else 's' }}</small>
    </div>
    <div class="gauge-ring {% if m.health_score >= 65 %}g-good{% elif m.health_score >= 45 %}g-fair{% else %}g-bad{% endif %}" style="--val:{{ m.health_score }};width:110px;height:110px">
      <div class="gauge-inner"><span style="font-size:1.4rem">{{ m.health_score }}</span>
      <small class="text-muted" style="font-size:.6rem">{{ m.score_label }}</small></div>
    </div>
  </div>

  <form method="POST">
    <h6 class="fw-bold text-primary mb-3"><i class="bi bi-person"></i> BASIC DETAILS</h6>
    <div class="row g-3">
      <div class="col-md-3"><label class="form-label small fw-semibold">Age</label>
        <input type="number" name="age" min="1" max="120" class="form-control" value="{{ user.age or '' }}"></div>
      <div class="col-md-3"><label class="form-label small fw-semibold">Gender</label>
        <select name="gender" class="form-select"><option value="">--</option>
        {% for g in ['Male','Female','Other'] %}<option {% if user.gender == g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></div>
      <div class="col-md-3"><label class="form-label small fw-semibold">Blood Group</label>
        <select name="blood_group" class="form-select"><option value="">--</option>
        {% for b in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}<option {% if user.blood_group == b %}selected{% endif %}>{{ b }}</option>{% endfor %}</select></div>
      <div class="col-md-3"><label class="form-label small fw-semibold">City</label>
        <input type="text" name="city" class="form-control" value="{{ user.city or '' }}"></div>
      <div class="col-md-4"><label class="form-label small fw-semibold">Occupation</label>
        <input type="text" name="occupation" class="form-control" value="{{ user.occupation or '' }}"></div>
      <div class="col-md-4"><label class="form-label small fw-semibold">Height (cm)</label>
        <input type="number" name="height_cm" class="form-control" value="{{ user.height_cm or '' }}"></div>
      <div class="col-md-4"><label class="form-label small fw-semibold">Weight (kg)</label>
        <input type="number" name="weight_kg" class="form-control" value="{{ user.weight_kg or '' }}"></div>
    </div>

    <h6 class="fw-bold text-primary mt-4 mb-3"><i class="bi bi-lightning-charge"></i> LIFESTYLE</h6>
    <div class="row g-3">
      <div class="col-md-4"><label class="form-label small fw-semibold">Physical Activity</label>
        <select name="physical_activity" class="form-select"><option value="">--</option>
        {% for a in activities %}<option {% if user.physical_activity == a %}selected{% endif %}>{{ a }}</option>{% endfor %}</select></div>
      <div class="col-md-4"><label class="form-label small fw-semibold">Sleep (hours)</label>
        <input type="number" step="0.5" name="sleep_hours" class="form-control" value="{{ user.sleep_hours or '' }}"></div>
      <div class="col-md-4"><label class="form-label small fw-semibold">Diet Type</label>
        <select name="diet_type" class="form-select"><option value="">--</option>
        {% for d in diets %}<option {% if user.diet_type == d %}selected{% endif %}>{{ d }}</option>{% endfor %}</select></div>
      <div class="col-md-4"><label class="form-label small fw-semibold">Smoking</label>
        <select name="smoking" class="form-select"><option value="">--</option>
        {% for s in smoking %}<option {% if user.smoking == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
      <div class="col-md-4"><label class="form-label small fw-semibold">Alcohol</label>
        <select name="alcohol" class="form-select"><option value="">--</option>
        {% for a in alcohol %}<option {% if user.alcohol == a %}selected{% endif %}>{{ a }}</option>{% endfor %}</select></div>
      <div class="col-md-4"><label class="form-label small fw-semibold">Stress Level</label>
        <select name="stress_level" class="form-select"><option value="">--</option>
        {% for s in stress %}<option {% if user.stress_level == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
    </div>

    <h6 class="fw-bold text-primary mt-4 mb-3"><i class="bi bi-journal-medical"></i> MEDICAL BACKGROUND</h6>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label small fw-semibold">Past medical history</label>
        <textarea name="past_history" rows="3" class="form-control">{{ user.past_history or '' }}</textarea></div>
      <div class="col-md-6"><label class="form-label small fw-semibold">Family medical history</label>
        <textarea name="family_history" rows="3" class="form-control">{{ user.family_history or '' }}</textarea></div>
      <div class="col-md-6"><label class="form-label small fw-semibold">Allergies</label>
        <textarea name="allergies" rows="2" class="form-control">{{ user.allergies or '' }}</textarea></div>
      <div class="col-md-6"><label class="form-label small fw-semibold">Current medications</label>
        <textarea name="medications" rows="2" class="form-control">{{ user.medications or '' }}</textarea></div>
    </div>

    <button class="btn btn-grad mt-4 px-4"><i class="bi bi-check-lg"></i> Save Profile</button>
  </form>
</div>
{% endblock %}
